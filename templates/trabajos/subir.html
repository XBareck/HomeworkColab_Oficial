{% extends 'base.html' %}

{% block title %}Subir Aporte - HomeWorkColab{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-lg-6 col-md-8">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Subir nuevo material</h2>
            <p class="text-muted small">Llena los datos para publicar tu aporte.</p>
        </div>

        <div class="card border-0 shadow-sm rounded-4" style="background-color: white !important;">
            <div class="card-body p-4 p-md-5">
                
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark small">TÍTULO DEL TRABAJO</label>
                        <input type="text" name="titulo" class="form-control input-clean" placeholder="Ej: Resumen Bioquímica II" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark small">CATEGORÍA O ASIGNATURA</label>
                        <select name="categoria" class="select-final-boss" required>
                            <option value="" selected disabled>Selecciona una opción...</option>
                            {% for cat in categorias %}
                                <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark small">DESCRIPCIÓN CORTA</label>
                        <textarea name="descripcion" class="form-control input-clean" rows="3" placeholder="¿De qué trata?" required></textarea>
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-bold text-dark small">ARCHIVO ADJUNTO</label>
                        <div class="upload-zone-final">
                            <input type="file" name="archivo_url" id="fileInput" required>
                            <div id="fileContent">
                                <i class="bi bi-file-earmark-arrow-up text-primary fs-3"></i><br>
                                <span class="fw-bold text-primary">Elegir archivo</span>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-3 py-3">Publicar ahora</button>
                        <a href="{% url 'home' %}" class="btn btn-link text-secondary text-decoration-none">Cancelar</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<style>
    /* 1. RESET TOTAL DEL SELECTOR (Adiós bloque gris) */
    .select-final-boss {
        display: block !important;
        width: 100% !important;
        background-color: #f8fafc !important; /* Fondo suave */
        color: #1e293b !important; /* Texto oscuro */
        border: 1px solid #e2e8f0 !important;
        padding: 12px 15px !important;
        border-radius: 10px !important;
        font-size: 1rem !important;
        cursor: pointer !important;
        /* Esto elimina el renderizado de Bootstrap que falla */
        -webkit-appearance: menulist !important;
        -moz-appearance: menulist !important;
        appearance: menulist !important;
    }

    /* Forzamos que las opciones internas sean SIEMPRE blancas */
    .select-final-boss option {
        background-color: white !important;
        color: black !important;
    }

    .select-final-boss:focus {
        outline: 2px solid #2563eb !important;
        background-color: white !important;
    }

    /* 2. Estilos para los inputs normales */
    .input-clean {
        background-color: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        padding: 12px !important;
        border-radius: 10px !important;
    }
    .input-clean:focus {
        background-color: white !important;
        border-color: #2563eb !important;
        box-shadow: none !important;
    }

    /* 3. Estilo zona de carga */
    .upload-zone-final {
        position: relative;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        padding: 30px;
        text-align: center;
        background: #f8fafc;
    }
    .upload-zone-final:hover { border-color: #2563eb; background: #f1f5f9; }
    .upload-zone-final input {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; z-index: 5;
    }
</style>

<script>
    document.getElementById('fileInput').onchange = function() {
        if(this.files && this.files[0]) {
            document.getElementById('fileContent').innerHTML = `
                <i class="bi bi-check-circle-fill text-success fs-3"></i><br>
                <span class="text-success fw-bold">${this.files[0].name}</span>
            `;
        }
    };
</script>
{% endblock %}
